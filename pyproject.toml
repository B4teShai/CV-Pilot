[build-system]
# exact pins, not hashes: pip builds in isolation without hash checking; the pins stop a newer
# backend (or one of its dependencies) from changing what a build produces. Keep them equal to uv.lock.
requires = [
  "hatchling==1.32.4",
  "packaging==26.3",
  "pathspec==1.1.1",
  "pluggy==1.6.0",
  "trove-classifiers==2026.9.21.13",
]
build-backend = "hatchling.build"

[project]
name = "cvpilot"
dynamic = ["version"]
description = "CV-native run companion: regression gates, remote monitoring and resume-safe checkpoints."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "The CV-Pilot contributors" }]
keywords = ["computer-vision", "experiment-tracking", "regression-testing", "checkpoints", "mlops"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
dependencies = [
  "click>=8.1",
  "numpy>=1.26",  # tested: 1.26.4 (tests, mypy), 2.2.6 (Python 3.10), 2.5.4 (Python 3.13)
  "pyarrow>=18",
  "pydantic>=2.7",
  "structlog>=24.1",
  "typer>=0.12",
]

[project.urls]
Homepage = "https://github.com/B4teShai/CV-Pilot"
Repository = "https://github.com/B4teShai/CV-Pilot"
Changelog = "https://github.com/B4teShai/CV-Pilot/blob/main/CHANGELOG.md"
Issues = "https://github.com/B4teShai/CV-Pilot/issues"

[project.optional-dependencies]
ultralytics = ["ultralytics>=8.2"]
lightning = ["lightning>=2.2"]
mmengine = ["mmengine>=0.10"]
# RF-DETR 1.11.2 (Apache-2.0) and its [train] extra, minus roboflow: that upload client is not
# needed to train and pins typer<0.26, which would hold back the core typer for every install.
rfdetr = [
  "rfdetr>=1.11,<1.12",  # the hook patches rfdetr.training.build_trainer: move on purpose
  "pytorch-lightning>=2.6,<3,!=2.6.2,!=2.6.3",
  "torchmetrics[detection]>=1.8.2,<1.9",
  "peft",
  "hotcoco==1.0.1",
  "faster-coco-eval>=1.7.2",
  "ultrafast-pycocotools>=0.1.10,<0.2",
  "vernier>=0.5.3,<0.6",
  "pycocotools",
  "scipy",
  "simplejpeg>=1.9,<2",
  "torch-hungarian==0.1.0rc0",
]
hf = ["transformers[torch]>=4.46"]
mlflow = ["mlflow-skinny>=2.14"]
wandb = ["wandb>=0.17"]
trackio = ["trackio>=0.2"]
safetensors = ["safetensors>=0.4"]
remote = ["fsspec>=2024.2"]  # the library only: add the backend of your scheme, or use remote-*
remote-s3 = ["fsspec>=2024.2", "s3fs>=2024.2"]
remote-gcs = ["fsspec>=2024.2", "gcsfs>=2024.2"]
remote-azure = ["fsspec>=2024.2", "adlfs>=2024.2"]

[project.scripts]
cvpilot = "cvpilot.cli.app:main"

[project.entry-points."cvpilot.stores"]
local = "cvpilot.store.local:open_store"

[project.entry-points."cvpilot.tables"]
parquet = "cvpilot.store.tables:open_tables"

[project.entry-points."cvpilot.hooks"]
lightning = "cvpilot.hooks.lightning:LightningHook"
hf = "cvpilot.hooks.hf_trainer:HFHook"
ultralytics = "cvpilot.hooks.ultralytics:YoloHook"
mmengine = "cvpilot.hooks.mmengine:MMEngineHook"
rfdetr = "cvpilot.hooks.rfdetr:RFDETRHook"

[project.entry-points."cvpilot.forwarders"]
mlflow = "cvpilot.forward.mlflow:MlflowForwarder"
wandb = "cvpilot.forward.wandb:WandbForwarder"
trackio = "cvpilot.forward.trackio:TrackioForwarder"

[project.entry-points."cvpilot.channels"]
webhook = "cvpilot.notify.webhook:WebhookChannel"
slack = "cvpilot.notify.slack:SlackChannel"
telegram = "cvpilot.notify.telegram:TelegramChannel"

[project.entry-points."cvpilot.remotes"]
s3 = "cvpilot.remote.fsspec_store:open_remote"
gs = "cvpilot.remote.fsspec_store:open_remote"
az = "cvpilot.remote.fsspec_store:open_remote"
memory = "cvpilot.remote.fsspec_store:open_remote"

[project.entry-points."cvpilot.spot_notices"]
aws = "cvpilot.remote.spot:AwsSpotNotice"
gcp = "cvpilot.remote.spot:GcpPreemptionNotice"

[project.entry-points."cvpilot.capturers"]
git = "cvpilot.capture.env:capture_git"
packages = "cvpilot.capture.env:capture_packages"
python = "cvpilot.capture.env:capture_python"
host = "cvpilot.capture.env:capture_host"
gpu = "cvpilot.capture.env:capture_gpu"
command = "cvpilot.capture.env:capture_command"

[tool.hatch.version]
path = "src/cvpilot/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/cvpilot"]

[tool.hatch.build.targets.sdist]
# the package and its metadata only: no tests, benchmarks, plans, docs, workflows or fixtures
include = [
  "/src/cvpilot",
  "/LICENSE",
  "/NOTICE",
  "/README.md",
  "/CHANGELOG.md",
  "/pyproject.toml",
]
exclude = ["**/__pycache__", "**/*.py[cod]", "**/.DS_Store"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    "pycocotools==2.0.11",
    "pyyaml>=6",
    "safetensors>=0.4",
    "fsspec>=2024.2",
    "build==1.6.1",
    "hatchling>=1.27",
    "tomli>=2; python_version < '3.11'",
    "twine==7.0.0",
]
docs = [
    "mkdocs==1.6.1",
    "mkdocs-material==9.7.7",
]
audit = [
    "pip-audit==2.10.1",
]

[tool.uv]
default-groups = ["dev", "docs"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
# notebooks: imports sit next to the cell that uses them, and printed tables have long lines
"notebooks/**" = ["E402", "E501"]

[tool.mypy]
strict = true
files = ["src"]
python_version = "3.10"

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*", "pynvml"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not real_libs and not clone'"
markers = [
  "chaos: kills a subprocess mid-write and checks recovery",
  "clone: installs a fresh clone with pip in a new virtual environment (needs the network for dependencies); off by default (pytest -m clone)",
  "parity: compares metrics with the pycocotools reference",
  "packaging: builds the wheel and the sdist and inspects them (nothing is uploaded)",
  "real_libs: smoke test against the real tracker or framework library; off by default (pytest -m real_libs)",
]
